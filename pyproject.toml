[project]
name = "tenant-control-plane"
version = "0.1.0"
description = "A durable, asynchronous tenant provisioning control plane"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pika>=1.3,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "httpx2>=2.16,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real RabbitMQ broker"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["control_plane"]
omit = ["control_plane/__main__.py", "control_plane/inject.py", "control_plane/smoke.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
